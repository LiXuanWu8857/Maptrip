<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Maptrip 模組化預覽（實驗）</title>
<style>
  :root{
    --ground:#FBF8F9;--panel:#fff;--panel2:#F4EEF1;--ink:#1F1A1C;--muted:#6E6369;
    --line:rgba(31,26,28,.12);--accent:#E14C77;--accent-fill:#FF5E8A;
    --ok:#2E7D5B;--ok-bg:rgba(46,125,91,.12);--warn:#B0701C;--warn-bg:rgba(176,112,28,.12);
    --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
    --cjk:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  @media(prefers-color-scheme:dark){:root{
    --ground:#151216;--panel:#1E1A20;--panel2:#252029;--ink:#F2ECEF;--muted:#B4A8AE;
    --line:rgba(255,255,255,.12);--accent:#FF89A9;--accent-fill:#FF5E8A;
    --ok:#66D2A3;--ok-bg:rgba(102,210,163,.14);--warn:#E4A857;--warn-bg:rgba(228,168,87,.14);
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--cjk);
    line-height:1.6;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
  .wrap{max-width:560px;margin:0 auto}
  .lab-tag{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--warn);background:var(--warn-bg);
    padding:4px 10px;border-radius:999px;font-weight:700;margin-bottom:12px}
  h1{font-size:1.5rem;margin:0 0 6px;letter-spacing:-.01em}
  .note{color:var(--muted);font-size:.9rem;margin:0 0 18px}
  .note b{color:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .stat .k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
  .stat .v{font-size:1.35rem;font-weight:750;margin-top:3px;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.82rem;font-weight:700;font-family:var(--mono)}
  .pill.idle{background:var(--panel2);color:var(--muted)}
  .pill.rec{background:var(--ok-bg);color:var(--ok)}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  button{font-family:inherit;font-size:.92rem;font-weight:600;border:none;border-radius:12px;
    padding:12px 14px;cursor:pointer;flex:1 1 auto;min-width:calc(50% - 4px)}
  .b-go{background:var(--accent-fill);color:#fff}
  .b-2{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  button:active{opacity:.85}
  .log{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
  .log h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
    font-family:var(--mono);margin:0 0 8px}
  pre{margin:0;font-family:var(--mono);font-size:.76rem;white-space:pre-wrap;word-break:break-word;
    color:var(--ink);max-height:240px;overflow:auto}
  .foot{margin-top:20px;font-size:.78rem;color:var(--muted);font-family:var(--mono)}
  .warnbox{background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px;
    padding:12px 14px;font-size:.84rem;color:var(--ink);margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <span class="lab-tag">Lab · 隔離實驗頁</span>
  <h1>模組化行程記錄 · 預覽</h1>
  <p class="note">這頁只載入 <b>lab/</b> 的 5 個新模組，<b>完全獨立於你正在用的 App</b>（App 從 <code>index.html</code> 載入，這頁不碰它）。用來驗證拆分後的 gate→clean→store→bg-geo→recorder 是否正常運作。</p>

  <div class="warnbox">⚠️ 這是<b>骨架版</b>：清理判準與儲存層是照指南重寫的簡化版，尚未搬入 App 的真實邏輯。僅供架構驗證。</div>

  <div class="grid">
    <div class="stat"><div class="k">狀態</div><div class="v"><span id="state" class="pill idle">閒置</span></div></div>
    <div class="stat"><div class="k">儲存模式</div><div class="v mono" id="mode" style="font-size:1.05rem">—</div></div>
    <div class="stat"><div class="k">目前收點</div><div class="v" id="pts">0</div></div>
    <div class="stat"><div class="k">里程 (m)</div><div class="v" id="dist">0</div></div>
  </div>

  <div class="btns">
    <button class="b-go" id="btn-start">▶ 開始記錄</button>
    <button class="b-2" id="btn-feed">＋ 餵 10 個模擬點</button>
    <button class="b-2" id="btn-drift">＋ 餵飄移叢</button>
    <button class="b-go" id="btn-end" style="background:var(--accent)">■ 結束（先落盤）</button>
  </div>
  <div class="btns">
    <button class="b-2" id="btn-fare">補車資 $250（事後更新）</button>
    <button class="b-2" id="btn-kill">模擬被砍後接回</button>
    <button class="b-2" id="btn-clear">清除本頁資料</button>
  </div>

  <div class="log">
    <h2>事件記錄</h2>
    <pre id="log">（按「開始記錄」開始）</pre>
  </div>
  <div class="log">
    <h2>已存行程（store）</h2>
    <pre id="dump">{}</pre>
  </div>

  <p class="foot" id="engines">modules: —</p>
</div>

<!-- 依序載入(被依賴者先載)：gate → clean → store/bg-geo → recorder -->
<script src="geo-gate.js"></script>
<script src="geo-clean.js"></script>
<script src="trip-store.js"></script>
<script src="bg-geo.js"></script>
<script src="trip-recorder.js"></script>
<script>
(async function main(){
  var $ = function(id){ return document.getElementById(id); };
  var logLines = [];
  function log(m){ logLines.unshift(new Date().toLocaleTimeString()+'  '+m);
    if(logLines.length>40)logLines.pop(); $('log').textContent = logLines.join('\n'); }

  var store = new TripStore();
  await store.init();
  var geo = window.MaptripBgGeo._makeMock();     // 預覽用 mock，可手動餵點
  var recorder = new TripRecorder({
    store: store, gate: window.MaptripGeoGate, clean: window.MaptripGeoClean,
    geo: geo, now: function(){ return Date.now(); }
  });

  $('mode').textContent = store.mode();
  $('engines').textContent = 'modules loaded: GeoGate · GeoClean · TripStore(' + store.mode() +
    ') · BgGeo(' + geo.kind + ') · TripRecorder';
  log('booted，storage=' + store.mode() + '，geo=' + geo.kind);

  // 若上次有進行中的行程，接回
  if (recorder.restoreActiveTrip()){
    log('偵測到未結束行程 → 已接回（' + recorder.active.coords.length + ' 點）');
    setRec(true);
  }
  refresh();

  var seed = { lat:25.0330, lng:121.5654 }, k=0;
  function setRec(on){
    $('state').className = 'pill ' + (on?'rec':'idle');
    $('state').textContent = on ? '記錄中' : '閒置';
  }
  function refresh(){
    var a = recorder.active;
    $('pts').textContent = a ? a.coords.length : 0;
    $('dist').textContent = a ? Math.round(a.totalDist) : 0;
    $('dump').textContent = JSON.stringify(store.getAll(), null, 1);
  }

  $('btn-start').onclick = function(){
    if (recorder.active){ log('已在記錄中'); return; }
    recorder.startTrip(); k=0; setRec(true);
    log('▶ 開始記錄，trip id=' + recorder.active.id);
    refresh();
  };
  $('btn-feed').onclick = function(){
    if (!recorder.active){ log('請先開始記錄'); return; }
    for (var i=0;i<10;i++){ k++;
      geo._feed({ lat: seed.lat + k*0.00012, lng: seed.lng + k*0.00003, accuracy:5, t: Date.now()+k*1000 }); }
    log('餵入 10 個正常點');
    refresh();
  };
  $('btn-drift').onclick = function(){
    if (!recorder.active){ log('請先開始記錄'); return; }
    // 一叢來回飄移（甩出去又甩回原地）
    var base = { lat: seed.lat + k*0.00012, lng: seed.lng + k*0.00003 };
    var jag = [[0.0006,-0.0004],[ -0.0005,0.0007],[0.0006,-0.0006],[-0.0006,0.0003]];
    jag.forEach(function(d,idx){ geo._feed({ lat: base.lat+d[0], lng: base.lng+d[1], accuracy:8, t: Date.now()+ (idx+1)*800 }); });
    geo._feed({ lat: base.lat, lng: base.lng, accuracy:6, t: Date.now()+4000 }); // 甩回原地
    log('餵入一叢飄移點（結束時 cleanTrace 會嘗試收掉）');
    refresh();
  };
  $('btn-end').onclick = function(){
    if (!recorder.active){ log('沒有進行中的行程'); return; }
    var before = recorder.active.coords.length;
    var trip = recorder.endTrip();
    setRec(false);
    log('■ 結束並先落盤：fare=0，清理前 '+before+' 點 → 清理後 '+trip.coords.length+' 點');
    window._lastTrip = trip;
    refresh();
  };
  $('btn-fare').onclick = function(){
    if (!window._lastTrip){ log('請先結束一趟'); return; }
    window._lastTrip.fare = 250; window._lastTrip.paymentMethod = 'cash';
    recorder.updateTrip(window._lastTrip);
    log('事後更新車資 $250（同一趟 id 覆蓋，證明先落盤後可補）');
    refresh();
  };
  $('btn-kill').onclick = function(){
    if (!recorder.active){ log('請先開始記錄（模擬記到一半被砍）'); return; }
    var n = recorder.active.coords.length;
    // 模擬 App 被砍：丟掉記憶體中的 recorder，只留 localStorage 的 ACTIVE_KEY
    var store2 = store;
    var geo2 = window.MaptripBgGeo._makeMock();
    recorder = new TripRecorder({ store:store2, gate:window.MaptripGeoGate,
      clean:window.MaptripGeoClean, geo:geo2, now:function(){return Date.now();} });
    geo = geo2;
    var ok = recorder.restoreActiveTrip();
    log('💥 模擬被砍 → 新 recorder.restoreActiveTrip()=' + ok +
        '，接回 ' + (recorder.active?recorder.active.coords.length:0) + ' 點（原 '+n+'）');
    refresh();
  };
  $('btn-clear').onclick = function(){
    try{ localStorage.removeItem('maptrip_lab_trips'); localStorage.removeItem('maptrip_lab_active_trip'); }catch(e){}
    log('已清除本頁 localStorage（不影響 App）。重新整理後歸零。');
  };
})();
</script>
</body>
</html>
