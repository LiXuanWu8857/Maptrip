<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<!-- 冷啟動自動 reload 一次：確保 WKWebView viewport 穩定在 reload 狀態，
     讓 reload-fix CSS（top:0）正確消除動態島下方多餘間距。
     sessionStorage 旗標確保每個 session 只 reload 一次，不會無限迴圈。 -->
<script>
if (!sessionStorage.getItem('booted')) {
  sessionStorage.setItem('booted', '1');
  location.reload();
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maptrip">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>Maptrip 行程紀錄</title>
<!-- index.html 版本：app.js 會比對此值，偵測到舊版 index 就自動重新整理 -->
<script>window.INDEX_VERSION = '1.1.122';</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';"/>
<!-- 防止 WKWebView 快取舊版：每次載入都帶時間戳，強制取得最新 CSS -->
<script>document.write('<link rel="stylesheet" href="css/style.css?t=' + Date.now() + '">');</script>
<!-- Inline critical CSS: overrides external CSS so it works even when style.css is stale-cached -->
<style>
/* 頂部安全區 + 頂列 + 地圖：style.css 靠網路才載入，但這裡是 inline 立即生效，
   避免 location.reload() 後 style.css 尚未取回時出現頂部大片空白。 */
#top-safe { display: none !important; }
#top-bar {
  position: fixed !important;
  top: env(safe-area-inset-top, 0px) !important;
  left: 0 !important; right: 0 !important;
  height: 48px !important;
  background: rgba(255,255,255,0.9) !important;
  display: flex !important; align-items: center !important;
  justify-content: space-between !important;
  padding: 0 16px !important;   /* padding-top:0 防止舊快取 padding-top 疊加 */
  z-index: 21 !important;
}
#map { position: fixed !important; inset: 0 !important; z-index: 0 !important; background: #e8e4de !important; }
#bottom-bar {
  position: fixed !important;
  bottom: 0 !important;
  left: 0 !important; right: 0 !important;
  background: rgba(255,255,255,0.95) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border-top: 1px solid rgba(0,0,0,0.08) !important;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.06) !important;
  z-index: 20 !important;
}
#bottom-buttons {
  height: calc(47px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 12px;
}
.ctrl-btn  { padding: 2px 14px !important; gap: 2px !important; }
.ctrl-icon { line-height: 1 !important; }
@media (prefers-color-scheme: dark) {
  #top-bar   { background: rgba(18,18,18,0.9) !important; }
  #map       { background: #1a1a1a !important; }
  #bottom-bar { background: rgba(24,24,24,0.96) !important; border-top-color: rgba(255,255,255,0.07) !important; box-shadow: 0 -2px 12px rgba(0,0,0,0.3) !important; }
}
</style>
<!-- WKWebView reload fix：重新整理後 viewport 已下移 safe-area-inset-top px，
     env(safe-area-inset-top) 仍回傳原值，造成 top-bar 雙重偏移。
     偵測到 reload 時立即注入 top:0 覆寫，消除多餘間距。 -->
<script>
(function () {
  try {
    var navType = '';
    var navEntries = performance.getEntriesByType('navigation');
    if (navEntries.length) {
      navType = navEntries[0].type;
    } else if (performance.navigation) {
      navType = performance.navigation.type === 1 ? 'reload' : 'navigate';
    }
    if (navType === 'reload') {
      var s = document.createElement('style');
      s.id = 'reload-fix';
      s.textContent =
        '#top-bar{top:0!important}' +
        '#top-menu{top:52px!important}' +
        '#gps-badge{top:56px!important}' +
        '#tile-toggle{top:56px!important}' +
        '#autostart-banner.show{top:56px!important}' +
        '#arrival-banner.show{top:56px!important}';
      document.head.appendChild(s);
    }
  } catch (e) {}
})();
</script>
</head>
<body>

<!-- Safe-area fill behind Dynamic Island -->
<div id="top-safe"></div>

<!-- Top Bar -->
<div id="top-bar">
  <div id="top-left">
    <div id="top-date"></div>
    <div id="top-tripcount"><span id="trip-count">0</span> 趟</div>
  </div>
  <div id="top-actions">
    <button class="icon-btn" onclick="hardReload()" title="重新整理">🔄</button>
    <button class="icon-btn" onclick="toggleTopMenu()" title="選單">☰</button>
  </div>
</div>

<!-- Top Menu Dropdown -->
<div id="top-menu" style="display:none">
  <button data-menu="today">📋 今日行程</button>
  <button data-menu="history">📅 歷史行程</button>
  <button data-menu="sync">☁️ 雲端同步</button>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Auto-start Banner -->
<div id="autostart-banner">
  <div id="autostart-info">
    <span>🚗</span>
    <span>偵測到行駛中，要開始記錄行程嗎？</span>
  </div>
  <div id="autostart-btns">
    <button id="autostart-dismiss" onclick="dismissAutoStart()">略過</button>
    <button id="autostart-confirm" onclick="confirmAutoStart()">開始記錄</button>
  </div>
</div>

<!-- Arrival Banner -->
<div id="arrival-banner">
  <div id="arrival-info">
    <span id="arrival-icon">📍</span>
    <span id="arrival-msg">偵測到您已停車，要結束行程嗎？</span>
  </div>
  <div id="arrival-btns">
    <button id="arrival-dismiss" onclick="arrivalDismiss()">繼續記錄</button>
    <button id="arrival-confirm" onclick="arrivalConfirm()">結束行程</button>
  </div>
</div>

<!-- GPS Badge -->
<div id="gps-badge" class="badge-off">📍 等待 GPS</div>

<!-- Tile Toggle -->
<button id="tile-toggle">🛰 衛星</button>

<!-- Solo Trip Bar：左右滑或按箭頭切換趟次 -->
<div id="solo-bar" style="display:none">
  <button id="solo-prev" class="solo-arrow" onclick="soloPrev()">‹</button>
  <span id="solo-info"></span>
  <button id="solo-next" class="solo-arrow" onclick="soloNext()">›</button>
  <button id="solo-exit" onclick="exitSoloMode()">✕ 全部</button>
</div>

<!-- Day Preview Bar：預覽某日全部行程時的底部資訊列 -->
<div id="day-preview-bar" style="display:none">
  <div id="dp-info"></div>
  <button id="dp-close" onclick="exitDayPreview()">✕ 關閉</button>
</div>

<!-- Recording Banner -->
<div id="rec-banner" style="display:none">
  <div id="rec-dot"></div>
  <span id="rec-time">00:00</span>
  <span id="rec-dist">0 m</span>
  <button id="arrive-btn" onclick="endTrip()">已抵達 ✓</button>
</div>

<!-- Bottom Controls -->
<div id="bottom-bar">
  <div id="bottom-buttons">
    <button class="ctrl-btn" id="start-btn" onclick="startTrip()">
      <span class="ctrl-icon">▶</span>
      <span class="ctrl-label">開始行程</span>
    </button>
    <button class="ctrl-btn" onclick="toggleTripList()">
      <span class="ctrl-icon">📋</span>
      <span class="ctrl-label">今日行程</span>
    </button>
  </div>
</div>

<!-- My Location FAB（Google Maps 風格，右下角浮動） -->
<button id="locate-btn" onclick="centerOnMe()" title="我的位置">
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="3 11 22 2 13 21 11 13 3 11"/>
  </svg>
</button>

<!-- Trip List Sheet -->
<div id="sheet-overlay" onclick="closeActiveSheet()" style="display:none"></div>
<div id="trip-sheet" style="display:none">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span id="sheet-title">今日行程</span>
    <button class="replay-btn" onclick="openReplay()">▶ 回放</button>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
  </div>
  <div id="sheet-body"></div>
</div>

<!-- History Sheet -->
<div id="history-sheet" style="display:none">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span>歷史紀錄</span>
    <button class="sheet-close" onclick="closeHistory()">✕</button>
  </div>
  <div id="history-body"></div>
  <div id="version-label" onclick="onVersionTap()" style="text-align:center;padding:8px 0 14px;font-size:0.72rem;color:#9aa0a6;user-select:none;cursor:default;flex-shrink:0">v—</div>
</div>

<!-- Fare Dialog -->
<div id="fare-overlay"></div>
<div id="fare-dialog">
  <div class="sheet-handle"></div>
  <div id="fare-header">行程完成</div>
  <div id="fare-summary">
    <div class="fare-row">
      <span class="fare-label">開始</span><span id="fs-start"></span>
    </div>
    <div class="fare-row">
      <span class="fare-label">結束</span><span id="fs-end"></span>
    </div>
    <div class="fare-row">
      <span class="fare-label">時間</span><span id="fs-dur"></span>
    </div>
    <div class="fare-row">
      <span class="fare-label">里程</span><span id="fs-dist"></span>
    </div>
  </div>
  <div id="fare-input-row">
    <span id="fare-currency">NT$</span>
    <input id="fare-input" type="number" inputmode="numeric" placeholder="輸入金額" min="0">
  </div>
  <div id="fare-btns">
    <button id="fare-skip">略過</button>
    <button id="fare-save">儲存行程</button>
  </div>
</div>

<!-- Replay Panel -->
<div id="replay-panel">
  <div class="sheet-handle"></div>
  <div id="replay-header">
    <div id="replay-trip-label">第 1 趟 / 共 1 趟</div>
    <button id="replay-close-btn" onclick="closeReplay()">✕</button>
  </div>
  <div id="replay-trip-info"></div>
  <div id="replay-controls">
    <div id="replay-speed">
      <span class="speed-end">1x</span>
      <div id="speed-track">
        <div id="speed-track-bg"></div>
        <div id="speed-fill"></div>
        <div id="speed-thumb"></div>
        <div id="speed-scroll-hitarea"><div id="speed-scroll-content"></div></div>
      </div>
      <span class="speed-end">20x</span>
      <span id="speed-value">5x</span>
    </div>
    <div id="replay-action-btns">
      <button id="replay-restart-btn" onclick="startReplay()" title="重播">↺</button>
      <button id="replay-play-btn" onclick="toggleReplayPause()">⏸</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Firebase（雲端同步）：compat 版本可直接用全域 firebase，不需打包工具 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>document.write('<scr' + 'ipt src="js/sync.js?t=' + Date.now() + '"></scr' + 'ipt>');</script>

<!-- Leaflet 多 CDN 備援載入：冷開機時某個 CDN 載入失敗會自動換下一個，
     全部失敗才自動重載一次（避免「第一次開地圖掛掉、要按重置」）。 -->
<script>
(function () {
  var LEAFLET_CDNS = [
    'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
    'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
    'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'
  ];
  function loadScript(src, onload, onerror) {
    var s = document.createElement('script');
    s.src = src; s.async = false;
    s.onload = onload; s.onerror = onerror;
    document.body.appendChild(s);
  }
  function loadApp() {
    sessionStorage.removeItem('lfRetry');
    loadScript('js/app.js?t=' + Date.now());
  }
  function tryLeaflet(i) {
    if (typeof L !== 'undefined') { loadApp(); return; }
    if (i >= LEAFLET_CDNS.length) {
      // 所有 CDN 都失敗（多半是冷開機網路還沒就緒）→ 自動重載一次
      if (!sessionStorage.getItem('lfRetry')) {
        sessionStorage.setItem('lfRetry', '1');
        setTimeout(function () { location.reload(); }, 1500);
      }
      return;
    }
    loadScript(LEAFLET_CDNS[i], loadApp, function () { tryLeaflet(i + 1); });
  }
  tryLeaflet(0);
})();
</script>
<!-- Cloud Sync Dialog -->
<div id="sync-overlay" onclick="closeSyncDialog()" style="display:none"></div>
<div id="sync-dialog" style="display:none">
  <div class="sync-title">☁️ 雲端同步</div>
  <div id="sync-status"></div>
  <div id="sync-actions"></div>
  <button class="sync-close" onclick="closeSyncDialog()">關閉</button>
</div>

<!-- Screenshot Preview Modal -->
<div id="screenshot-preview" style="display:none">
  <div id="screenshot-backdrop" onclick="closeScreenshotPreview()"></div>
  <div id="screenshot-modal">
    <img id="screenshot-img" />
    <div id="screenshot-actions">
      <button id="screenshot-share-btn" onclick="shareScreenshot()">分享</button>
      <button id="screenshot-download-btn" onclick="downloadScreenshot()">下載</button>
      <button id="screenshot-close-btn" onclick="closeScreenshotPreview()">✕</button>
    </div>
  </div>
</div>
</body>
</html>
