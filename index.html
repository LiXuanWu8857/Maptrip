<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maptrip">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>Maptrip 行程紀錄</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<!-- 防止 WKWebView 快取舊版：每次載入都帶時間戳，強制取得最新 CSS -->
<script>document.write('<link rel="stylesheet" href="css/style.css?t=' + Date.now() + '">');</script>
<!-- Inline critical CSS: overrides external CSS so it works even when style.css is stale-cached -->
<style>
#bottom-bar {
  position: fixed !important;
  bottom: 0 !important;
  left: 0 !important; right: 0 !important;
  padding-bottom: 0 !important;
  background: rgba(255,255,255,0.95) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border-top: 1px solid rgba(0,0,0,0.08) !important;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.06) !important;
  z-index: 20 !important;
}
#bottom-buttons {
  height: 62px;
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 12px;
}
@media (prefers-color-scheme: dark) {
  #bottom-bar { background: rgba(24,24,24,0.96) !important; border-top-color: rgba(255,255,255,0.07) !important; box-shadow: 0 -2px 12px rgba(0,0,0,0.3) !important; }
}
</style>
</head>
<body>

<!-- Safe-area fill behind Dynamic Island -->
<div id="top-safe"></div>

<!-- Top Bar -->
<div id="top-bar">
  <div id="top-left">
    <div id="top-date"></div>
    <div id="top-tripcount"><span id="trip-count">0</span> 趟</div>
  </div>
  <button class="icon-btn" onclick="toggleTripList()" title="行程清單">☰</button>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Auto-start Banner -->
<div id="autostart-banner">
  <div id="autostart-info">
    <span>🚗</span>
    <span>偵測到行駛中，要開始記錄行程嗎？</span>
  </div>
  <div id="autostart-btns">
    <button id="autostart-dismiss" onclick="dismissAutoStart()">略過</button>
    <button id="autostart-confirm" onclick="confirmAutoStart()">開始記錄</button>
  </div>
</div>

<!-- Arrival Banner -->
<div id="arrival-banner">
  <div id="arrival-info">
    <span id="arrival-icon">📍</span>
    <span id="arrival-msg">偵測到您已停車，要結束行程嗎？</span>
  </div>
  <div id="arrival-btns">
    <button id="arrival-dismiss" onclick="arrivalDismiss()">繼續記錄</button>
    <button id="arrival-confirm" onclick="arrivalConfirm()">結束行程</button>
  </div>
</div>

<!-- GPS Badge -->
<div id="gps-badge" class="badge-off">📍 等待 GPS</div>

<!-- Tile Toggle -->
<button id="tile-toggle">🛰 衛星</button>

<!-- Recording Banner -->
<div id="rec-banner" style="display:none">
  <div id="rec-dot"></div>
  <span id="rec-time">00:00</span>
  <span id="rec-dist">0 m</span>
  <button id="arrive-btn" onclick="endTrip()">已抵達 ✓</button>
</div>

<!-- Bottom Controls -->
<div id="bottom-bar">
  <div id="bottom-buttons">
    <button class="ctrl-btn" id="start-btn" onclick="startTrip()">
      <span class="ctrl-icon">▶</span>
      <span class="ctrl-label">開始行程</span>
    </button>
    <button class="ctrl-btn" id="locate-btn" onclick="centerOnMe()">
      <span class="ctrl-icon">⊕</span>
      <span class="ctrl-label">我的位置</span>
    </button>
    <button class="ctrl-btn" onclick="showHistory()">
      <span class="ctrl-icon">📅</span>
      <span class="ctrl-label">歷史紀錄</span>
    </button>
  </div>
</div>

<!-- Trip List Sheet -->
<div id="sheet-overlay" onclick="closeSheet()" style="display:none"></div>
<div id="trip-sheet" style="display:none">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span id="sheet-title">今日行程</span>
    <button class="replay-btn" onclick="openReplay()">▶ 回放</button>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
  </div>
  <div id="sheet-body"></div>
  <div class="sheet-footer">
    <button class="danger-btn" onclick="confirmClearDay()">清除今日全部行程</button>
  </div>
</div>

<!-- History Sheet -->
<div id="history-sheet" style="display:none">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span>歷史紀錄</span>
    <button class="sheet-close" onclick="closeHistory()">✕</button>
  </div>
  <div id="history-body"></div>
</div>

<!-- Fare Dialog -->
<div id="fare-overlay"></div>
<div id="fare-dialog">
  <div class="sheet-handle"></div>
  <div id="fare-header">行程完成</div>
  <div id="fare-summary">
    <div class="fare-row">
      <span class="fare-label">開始</span><span id="fs-start"></span>
    </div>
    <div class="fare-row">
      <span class="fare-label">結束</span><span id="fs-end"></span>
    </div>
    <div class="fare-row">
      <span class="fare-label">時間</span><span id="fs-dur"></span>
    </div>
    <div class="fare-row">
      <span class="fare-label">里程</span><span id="fs-dist"></span>
    </div>
  </div>
  <div id="fare-input-row">
    <span id="fare-currency">NT$</span>
    <input id="fare-input" type="number" inputmode="numeric" placeholder="輸入金額" min="0">
  </div>
  <div id="fare-btns">
    <button id="fare-skip">略過</button>
    <button id="fare-save">儲存行程</button>
  </div>
</div>

<!-- Replay Panel -->
<div id="replay-panel">
  <div class="sheet-handle"></div>
  <div id="replay-header">
    <div id="replay-trip-label">第 1 趟 / 共 1 趟</div>
    <button id="replay-close-btn" onclick="closeReplay()">✕</button>
  </div>
  <div id="replay-trip-info"></div>
  <div id="replay-controls">
    <div id="replay-speed-btns">
      <button class="speed-btn" onclick="setReplaySpeed(1,this)">1x</button>
      <button class="speed-btn active" onclick="setReplaySpeed(5,this)">5x</button>
      <button class="speed-btn" onclick="setReplaySpeed(10,this)">10x</button>
    </div>
    <div id="replay-action-btns">
      <button id="replay-restart-btn" onclick="startReplay()" title="重播">↺</button>
      <button id="replay-play-btn" onclick="toggleReplayPause()">⏸</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Update Bar -->
<div id="update-bar">
  <span>✅ 已更新至 <span id="update-ver"></span></span>
  <button>✕</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- 同上：強制取得最新 app.js -->
<script>document.write('<script src="js/app.js?t=' + Date.now() + '"><\/script>');</script>
</body>
</html>
